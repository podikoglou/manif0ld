[package]
name = "bsky-manifold-arb"
version = "0.1.0"
edition = "2021"
description = "Bluesky to Manifold auto-trader driven by Sieve filtering"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
firecrawl = "2"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rig = { path = "rig", default-features = false, features = ["reqwest", "rustls", "agent", "typesafeai"] }
# Serenity's rustls backend enables the `ring` provider while rig's reqwest
# stack enables `aws-lc-rs`; rustls then cannot auto-select at runtime. This
# direct dependency lets main() install the `ring` provider explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", features = ["rustls_backend"] }
sieve = { path = "sieve" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace]
members = ["sieve"]
# `rig` is its own workspace (vendored); Cargo must treat it as an external
# path dependency, not absorb it as a member of this workspace.
exclude = ["rig"]

# Keep debug artifacts small; this project is large enough to fill a disk.
[profile.dev]
debug = 0
